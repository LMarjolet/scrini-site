<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Scrini — icône de l'application.
       Reprend la langue visuelle des fonds d'écran : bleu nuit dégradé, halo
       décentré, pellicule à -28° avec ses perforations, motifs en gris bleuté.
       La bobine occupe 57 % de la largeur, ce qui la garde à l'abri du rognage
       en cercle, en carré arrondi ou en goutte selon les lanceurs Android. -->
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1E3050"/>
      <stop offset="1" stop-color="#0B1424"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.28" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#4C6B9E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4C6B9E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#E6EEF9"/>
      <stop offset="0.55" stop-color="#C3D1E4"/>
      <stop offset="1" stop-color="#9BAECB"/>
    </linearGradient>
    <clipPath id="cadre">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cadre)">
    <rect width="1024" height="1024" fill="url(#nuit)"/>
    <rect width="1024" height="1024" fill="url(#lueur)"/>

    <!-- Pellicule en fond, même inclinaison que les fonds d'écran -->
    <g transform="rotate(-28 512 512)">
      <rect x="-160" y="60" width="1400" height="190" fill="#22355A"/>
      <g fill="#16233F">
        <rect x="-100" y="92" width="58" height="50" rx="12"/>
        <rect x="60" y="92" width="58" height="50" rx="12"/>
        <rect x="220" y="92" width="58" height="50" rx="12"/>
        <rect x="380" y="92" width="58" height="50" rx="12"/>
        <rect x="540" y="92" width="58" height="50" rx="12"/>
        <rect x="700" y="92" width="58" height="50" rx="12"/>
        <rect x="860" y="92" width="58" height="50" rx="12"/>
        <rect x="1020" y="92" width="58" height="50" rx="12"/>
        <rect x="-100" y="168" width="58" height="50" rx="12"/>
        <rect x="60" y="168" width="58" height="50" rx="12"/>
        <rect x="220" y="168" width="58" height="50" rx="12"/>
        <rect x="380" y="168" width="58" height="50" rx="12"/>
        <rect x="540" y="168" width="58" height="50" rx="12"/>
        <rect x="700" y="168" width="58" height="50" rx="12"/>
        <rect x="860" y="168" width="58" height="50" rx="12"/>
        <rect x="1020" y="168" width="58" height="50" rx="12"/>
      </g>
    </g>

    <!-- Bobine -->
    <g transform="translate(512 528)">
      <circle r="290" fill="url(#metal)"/>
      <circle r="290" fill="none" stroke="#8296B4" stroke-width="26"/>
      <g fill="#16233F">
        <circle cx="0" cy="-168" r="72"/>
        <circle cx="160" cy="-52" r="72"/>
        <circle cx="99" cy="136" r="72"/>
        <circle cx="-99" cy="136" r="72"/>
        <circle cx="-160" cy="-52" r="72"/>
        <circle r="62"/>
      </g>
      <!-- Reflet : la lumière tombe du même côté que le halo du fond -->
      <path d="M-206 -168 A 262 262 0 0 1 -18 -258" fill="none"
            stroke="#F2F7FF" stroke-width="22" stroke-linecap="round"
            opacity="0.75"/>
    </g>
  </g>
</svg>
